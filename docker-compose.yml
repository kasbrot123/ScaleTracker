services:
  scaletracker:
    build: .
    container_name: scaletracker
    restart: unless-stopped
    ports:
      - "${SCALETRACKER_PORT:-${GEWICHT_PORT:-3003}}:3000"
    environment:
      APP_PASSWORD: ${APP_PASSWORD:?APP_PASSWORD in .env setzen}
      TZ: ${TZ:-Europe/Berlin}
      SEED_DEMO: ${SEED_DEMO:-true}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    volumes:
      - ./data:/data

